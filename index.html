<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Server | Official</title><link rel="stylesheet" href="style.css"><header><strong>✦ MAGIC SERVER</strong><nav><a href="#attractions">アトラクション</a><a href="#events">観光企画</a><a href="#apply">応募</a><a href="admin/">運営ログイン</a></nav></header><section class="hero"><p class="eyebrow">WELCOME TO THE MAGIC</p><h1>MAGIC<br>SERVER</h1><p>ブロックの世界に広がる、特別な一日。</p><a class="btn" href="#apply">観光企画に応募する</a></section><section class="section" id="attractions"><h2>ATTRACTIONS</h2><div class="cards" id="attractionsList"></div></section><section class="section alt" id="events"><h2>TOUR SCHEDULE</h2><div id="eventsList"></div></section><section class="section" id="apply"><h2>観光企画の参加応募</h2><p>希望する日時を選択してください。応募時点では参加は確定しません。運営から指定された招待枠が確定した場合のみ参加できます。</p><form id="applyForm"><label>ゲーマータグ<input id="tag" maxlength="16" required></label><label>企画<select id="event" required></select></label><label>参加希望日時（第1希望）<select id="slot" required></select></label><label>備考（任意）<textarea id="note" maxlength="300"></textarea></label><label><input style="display:inline;width:auto" type="checkbox" id="agree" required>応募情報を参加管理に利用することに同意します。企画終了後に応募情報・参加許可は削除されます。ワールドのプレイヤーデータは自動削除しません。</label><button>応募する</button><p id="message" role="status"></p></form></section><section class="section alt"><h2>SERVER GUIDE</h2><p id="server"></p><p id="map"></p><p class="muted">ファン制作の非公式サイトです。権利者の公式サイトではありません。</p></section><footer>✦ MAGIC SERVER</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></html>
