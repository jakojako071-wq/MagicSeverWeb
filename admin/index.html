<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Server 管理</title><link rel="stylesheet" href="../style.css"><header><strong>✦ MAGIC SERVER ADMIN</strong><a href="../">公式サイトへ</a></header><main class="section"><h1 style="font-size:40px">運営管理画面</h1><div id="login"><label>管理者メール<input id="email" type="email"></label><label>パスワード<input id="password" type="password"></label><button id="signIn">ログイン</button></div><div id="dashboard" hidden><button id="signOut">ログアウト</button><h2>アトラクション情報</h2><div id="attractions"></div><h3>新規アトラクション</h3><form id="attractionForm"><input name="name" placeholder="名前" required><input name="status" placeholder="公開状況" required><textarea name="description" placeholder="紹介文"></textarea><input name="video_url" placeholder="https://動画URL"><button>追加</button></form><h2>観光企画</h2><div id="events"></div><form id="eventForm"><input name="title" placeholder="企画名" required><label>開始<input type="datetime-local" name="starts_at" required></label><label>終了<input type="datetime-local" name="ends_at" required></label><textarea name="description" placeholder="概要"></textarea><button>企画を作成</button></form><h2>応募枠</h2><div id="slots"></div><form id="slotForm"><label>企画<select name="event_id" id="eventSelect"></select></label><label>開始<input type="datetime-local" name="starts_at" required></label><label>終了<input type="datetime-local" name="ends_at" required></label><label>定員（最大10）<input type="number" name="capacity" value="10" min="1" max="10" required></label><button>希望枠を追加</button></form><h2>応募と招待</h2><p>応募者の希望枠から、運営が招待日時を確定します。1枠の確定人数は最大10人です。</p><div id="applications" class="scroll"></div><p id="status" role="status"></p></div></main><script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></html>
