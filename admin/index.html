<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magic Server 管理</title><link rel="stylesheet" href="../style.css?v=8"><header><strong>✦ MAGIC SERVER ADMIN</strong><a href="../">公式サイトへ</a></header><main class="section"><h1 style="font-size:40px">運営管理画面</h1><div id="login"><label>管理者メール<input id="email" type="email"></label><label>パスワード<input id="password" type="password"></label><button id="signIn">ログイン</button></div><div id="dashboard" hidden><button id="signOut">ログアウト</button><h2>アトラクション情報</h2><div id="attractions"></div><h3>新規アトラクション</h3><form id="attractionForm"><input name="name" placeholder="名前" required><input name="status" placeholder="公開状況" required><textarea name="description" placeholder="紹介文"></textarea><input name="video_url" placeholder="https://動画URL"><button>追加</button></form><h2>施設管理（アトラクション・レストラン・ショップ）</h2>
<p>施設は公開・非公開を切り替えられます。待ち時間は手動更新です（30分経過で更新待ち表示）。</p>
<input id="facilityAdminSearch" placeholder="登録施設を検索"><select id="facilityAdminCategory"><option value="all">すべて</option><option value="attraction">アトラクション</option><option value="restaurant">レストラン</option><option value="shop">ショップ</option></select>
<div id="facilityAdminList"></div><h3>施設を新規登録</h3>
<form id="facilityForm"><label>種類<select name="category"><option value="attraction">アトラクション</option><option value="restaurant">レストラン</option><option value="shop">ショップ</option></select></label><label>施設名<input name="name" required maxlength="120"></label><label>パーク<input name="park" placeholder="ディズニーシーなど"></label><label>エリア<input name="area"></label><label>利用区分<select name="usage_mode"><option value="guide">紹介のみ</option><option value="usable">ゲーム内で利用可能</option></select></label><label>運営状況<select name="status"><option>準備中</option><option>運営中</option><option>休止中</option><option>終了</option></select></label><label>紹介文<textarea name="description"></textarea></label><label>メニュー・取扱商品など<textarea name="details"></textarea></label><label>画像URL<input name="image_url" type="url" placeholder="https://"></label><label>動画URL<input name="video_url" type="url" placeholder="https://"></label><label>待ち時間（分・アトラクションのみ）<input name="wait_minutes" type="number" min="0" max="999" placeholder="空欄で非掲載"></label><label>表示順<input name="sort_order" type="number" value="0"></label><label><input name="published" type="checkbox" style="width:auto">公開する</label><button>施設を登録</button></form><p id="facilityAdminStatus" role="status"></p><h2>観光企画</h2><div id="events"></div><form id="eventForm"><input name="title" placeholder="企画名" required><label>開始<input type="datetime-local" name="starts_at" required></label><label>終了<input type="datetime-local" name="ends_at" required></label><label>応募受付開始<input type="datetime-local" name="application_opens_at" required></label><label>応募受付終了<input type="datetime-local" name="application_closes_at" required></label><textarea name="description" placeholder="概要"></textarea><button>企画を作成</button></form><h2>応募枠</h2><div id="slots"></div><form id="slotForm"><label>企画<select name="event_id" id="eventSelect"></select></label><label>開始<input type="datetime-local" name="starts_at" required></label><label>終了<input type="datetime-local" name="ends_at" required></label><label>定員（最大10）<input type="number" name="capacity" value="10" min="1" max="10" required></label><button>希望枠を追加</button></form><h2>応募と招待</h2><p>応募者の希望枠から、運営が招待日時を確定します。1枠の確定人数は最大10人です。</p><div id="applications" class="scroll"></div><p id="status" role="status"></p></div></main><script src="../config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js?v=8"></script></html>
